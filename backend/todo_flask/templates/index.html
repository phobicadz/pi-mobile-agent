<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 40px auto;
            background: #f7f7f9;
            color: #222;
        }
        h1 {
            text-align: center;
        }
        form.add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        form.add-form input[type="text"] {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        form.add-form button {
            padding: 8px 16px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        li.done span.task-text {
            text-decoration: line-through;
            color: #999;
        }
        .task-text {
            flex: 1;
        }
        li form {
            margin: 0;
        }
        button.icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .empty {
            text-align: center;
            color: #888;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
        }
        .footer button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>📝 To-Do List</h1>

    <form class="add-form" action="{{ url_for('add') }}" method="post">
        <input type="text" name="task" placeholder="What needs doing?" autofocus required>
        <button type="submit">Add</button>
    </form>

    {% if tasks %}
    <ul>
        {% for task in tasks %}
        <li class="{{ 'done' if task.done else '' }}">
            <form action="{{ url_for('toggle', index=loop.index0) }}" method="post">
                <button type="submit" class="icon-btn" title="Toggle done">
                    {{ '✅' if task.done else '⬜' }}
                </button>
            </form>
            <span class="task-text">{{ task.text }}</span>
            <form action="{{ url_for('delete', index=loop.index0) }}" method="post">
                <button type="submit" class="icon-btn" title="Delete">🗑️</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="empty">No tasks yet — add one above!</p>
    {% endif %}

    {% if tasks %}
    <div class="footer">
        <form action="{{ url_for('clear') }}" method="post">
            <button type="submit">Clear all</button>
        </form>
    </div>
    {% endif %}
</body>
</html>
