name: pi_mobile_agent
description: "Mobile frontend for Pi coding agent control"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  
  # State management
  provider: ^6.0.0
  
  # UI/UX
  google_fonts: ^6.1.0
  flutter_markdown: ^0.6.0
  syntax_highlight: ^0.1.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  flutter_highlight: ^0.7.0
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
