<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!--
    The app draws under the status bar and the home indicator (see
    lib/utils/browser_viewport.dart, which adds viewport-fit=cover to the
    viewport tag Flutter Web writes), so an installed app uses the whole screen.
    "black-translucent" is what lets a standalone app on iOS do the same.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="pi_mobile_agent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    No <meta name="viewport"> here on purpose: Flutter Web removes any viewport
    tag it finds in the page and writes its own. The app extends that one with
    viewport-fit=cover at startup instead.
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Pin the page to the visual viewport.

    Without this, on iOS the layout viewport, the document element and Flutter's
    own element end up three different sizes: the last measurement on a phone
    read `inner 428x926`, `client 428x879`, `visual 428x926 offsetTop -47`, and
    `flutter-view` sitting at `top 47`. Pointer events arrive relative to the
    visual viewport, so a canvas that starts 47px below it makes every tap land
    somewhere other than the thing it was aimed at - buttons and list rows feel
    like their hit area is a little below where they are drawn. Nothing else in
    the app can correct that, because hit testing happens inside the engine.

    Making the document exactly the visual viewport, with no page scroll, is what
    removes the mismatch rather than compensating for it: `offsetTop` stays 0 and
    the canvas starts at 0. The chat scrolls inside Flutter, so the page having
    its own scroll was never something the app used - it only ever changed what
    the browser reported about where the canvas was.

    `!important` because the engine writes inline sizes onto its own element, and
    an inline style outranks a stylesheet rule without it.

    `100vh` first as the fallback, then `100dvh` where the browser understands
    dynamic viewport units - `dvh` is the one that tracks Safari's toolbars
    instead of ignoring them.
  -->
  <!--
    The height of the document is what Flutter Web sizes its canvas from, and on
    iOS it is not the height of the window. Measured on a phone, in one sample,
    in the same frame:

      window.innerHeight        428 x 926   the whole screen
      documentElement.clientHeight 428 x 879
      flutter-view (fixed, inset 0)  height 926
      Flutter's canvas          428 x 879   drawn at the top of that host

    So 47px of the host has no canvas in it and the page paints it: a white band
    across the bottom, 47px being the status-bar inset - `100dvh` on iOS is the
    screen minus the status bar, while `window.innerHeight` is the screen. Two
    rules for one box, and the app cannot argue with which one the browser chose.

    What it can use is the number the browser gives for its own window. This
    script runs before Flutter loads, so the first measurement Flutter takes is
    already the right one, and it re-applies on the events that change the
    window. The `100vh`/`100dvh` rules above stay as the fallback for the moments
    before this runs, and an inline style outranks a stylesheet rule without
    needing `!important`.
  -->
  <script>
    (function () {
      function pinDocumentToWindow() {
        var height = window.innerHeight;
        if (!height) return;
        document.documentElement.style.height = height + 'px';
      }

      pinDocumentToWindow();
      window.addEventListener('resize', pinDocumentToWindow);
      // Rotation reports the new orientation before it reports the new size.
      window.addEventListener('orientationchange', function () {
        setTimeout(pinDocumentToWindow, 250);
      });
      // The app rewrites the viewport meta at startup to add viewport-fit=cover,
      // which is exactly the kind of change a browser applies on its own
      // schedule; the settled size is the one the layout has to match.
      setTimeout(pinDocumentToWindow, 500);
      setTimeout(pinDocumentToWindow, 2000);
    })();
  </script>

  <style>
    html,
    body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Follows whatever the document ends up being, rather than resolving its own
       viewport unit that could disagree with it. */
    body {
      height: 100%;
    }

    flutter-view {
      /*
       * The canvas is never going to be the height of the screen on iOS.
       *
       * The root element was measured at `height: 926px` inline, and
       * `getComputedStyle` agreed it was 926px - while `clientHeight` reported
       * 879, which is 926 minus the 47px status-bar inset. iOS carves the status
       * bar out of the root element's client area whatever its box says, and
       * `clientHeight` is exactly what the engine reads on iOS (see
       * `full_page_dimensions_provider.dart`, which does that on purpose). So the
       * drawing surface is 879 tall, and no amount of resizing the page changes
       * that.
       *
       * What can change is where those 879 pixels sit. Pinned to `inset: 0` they
       * start at the top of the screen and stop 47px short of the bottom, which
       * is why the prompt field sits above the bottom edge with a strip of page
       * below it. Inset by the status bar instead, the canvas covers exactly the
       * area the browser considers usable - top edge to home indicator - and the
       * engine's measurement and the screen agree for the first time.
       *
       * The app then reserves only the safe areas that fall *inside* its own
       * canvas, which is what `PageGeometry.overlappedInsets` measures; the
       * status bar is outside it, so reserving it again would push the app bar
       * down twice.
       */
      position: fixed !important;
      top: env(safe-area-inset-top) !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: auto !important;
      height: auto !important;
    }
  </style>

  <title>pi_mobile_agent</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
