<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!--
    The app draws under the status bar and the home indicator (see
    lib/utils/browser_viewport.dart, which adds viewport-fit=cover to the
    viewport tag Flutter Web writes), so an installed app uses the whole screen.
    "black-translucent" is what lets a standalone app on iOS do the same.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="pi_mobile_agent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    No <meta name="viewport"> here on purpose: Flutter Web removes any viewport
    tag it finds in the page and writes its own. The app extends that one with
    viewport-fit=cover at startup instead.
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Pin the page to the visual viewport.

    Without this, on iOS the layout viewport, the document element and Flutter's
    own element end up three different sizes: the last measurement on a phone
    read `inner 428x926`, `client 428x879`, `visual 428x926 offsetTop -47`, and
    `flutter-view` sitting at `top 47`. Pointer events arrive relative to the
    visual viewport, so a canvas that starts 47px below it makes every tap land
    somewhere other than the thing it was aimed at - buttons and list rows feel
    like their hit area is a little below where they are drawn. Nothing else in
    the app can correct that, because hit testing happens inside the engine.

    Making the document exactly the visual viewport, with no page scroll, is what
    removes the mismatch rather than compensating for it: `offsetTop` stays 0 and
    the canvas starts at 0. The chat scrolls inside Flutter, so the page having
    its own scroll was never something the app used - it only ever changed what
    the browser reported about where the canvas was.

    `!important` because the engine writes inline sizes onto its own element, and
    an inline style outranks a stylesheet rule without it.

    `100vh` first as the fallback, then `100dvh` where the browser understands
    dynamic viewport units - `dvh` is the one that tracks Safari's toolbars
    instead of ignoring them.
  -->
  <style>
    html,
    body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    flutter-view {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <title>pi_mobile_agent</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
