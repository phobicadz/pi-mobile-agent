version: '3.8'

services:
  pi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PI_PROVIDER=${PI_PROVIDER:-anthropic}
      - PI_MODEL=${PI_MODEL:-claude-3-5-sonnet-20241022}
    volumes:
      - ~/.pi:/root/.pi  # Mount Pi config directory
      - ./backend/.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pi-data:
